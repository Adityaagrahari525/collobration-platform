version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campuslink-db
    restart: always
    environment:
      POSTGRES_USER: campuslink
      POSTGRES_PASSWORD: campuslink_secret
      POSTGRES_DB: campuslink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslink -d campuslink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuslink-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://campuslink:campuslink_secret@postgres:5432/campuslink_db?schema=public
      JWT_SECRET: campuslink_jwt_super_secure_production_secret_key_2026
      CORS_ORIGIN: http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuslink-web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
