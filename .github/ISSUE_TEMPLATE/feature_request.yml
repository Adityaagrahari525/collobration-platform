name: 💡 Feature Request / RFC
description: Suggest an enhancement, new academic protocol, or feature for CampusLink
title: "[RFC]: "
labels: ["enhancement", "rfc"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new consortium tools, inter-campus research protocols, and UX improvements!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or research friction?
      placeholder: I am always frustrated when trying to...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you'd like to see implemented.
      placeholder: Implement an automated...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have evaluated.
      placeholder: We tried using...
    validations:
      required: false
  - type: dropdown
    id: target-role
    attributes:
      label: Primary Beneficiary
      options:
        - Undergraduate & Graduate Student Scholars
        - Faculty PIs & Research Supervisors
        - Inter-University Consortium Administrators
        - All Users
    validations:
      required: true
