name: CampusLink CI & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Backend Dependencies
        run: cd backend && npm install

      - name: Typecheck Backend (TypeScript)
        run: cd backend && npx tsc --noEmit

      - name: Build Frontend Bundle (Vite)
        run: npm run build

  backend-audit-and-tests:
    name: Automated Architecture & Acceptance Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: campuslink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd backend && npm install

      - name: Migrate & Seed Test Database
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/campuslink_test?schema=public"
          JWT_SECRET: "test_jwt_secret_key_12345"
          REFRESH_TOKEN_SECRET: "test_refresh_secret_key_12345"
          PORT: 5000
        run: |
          cd backend
          npx prisma db push
          npm run prisma:seed

      - name: Start Backend in Background
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/campuslink_test?schema=public"
          JWT_SECRET: "test_jwt_secret_key_12345"
          REFRESH_TOKEN_SECRET: "test_refresh_secret_key_12345"
          PORT: 5000
          NODE_ENV: test
        run: |
          cd backend
          npm run dev &
          sleep 5

      - name: Run 14-Subsystem Comprehensive Audit Suite
        run: npm run test:audit

      - name: Run 9-Criteria Jury Acceptance End-to-End Suite
        run: npm run test:jury
